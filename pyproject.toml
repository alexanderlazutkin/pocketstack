[project]
name = "pocketstack"
version = "0.0.0"
description = "Demo: AI-agent + semantic layer (cube.dev) over TPC-H in DuckDB, BI on Evidence"
requires-python = ">=3.13"
dependencies = [
    "pocketstack-sqlmesh",
    "pocketstack-harness",
    "pocketstack-mcp",
]

[tool.uv.sources]
pocketstack-sqlmesh = { workspace = true }
pocketstack-harness = { workspace = true }
pocketstack-mcp = { workspace = true }

[tool.uv.workspace]
members = ["packages/sqlmesh", "packages/harness", "packages/mcp"]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["packages"]
