cubes:
  - name: sales_mov
    # Отклонения выручки по месяцам: YoY (к тому же месяцу прошлого года) и
    # PoP (к предыдущему месяцу), абс. и относительные.
    # Логика живёт ЗДЕСЬ, в семантическом слое Cube: подзапрос не материализуется
    # в DuckDB, выполняется при каждом запросе. Grain результата: (year, month).
    sql: |
      WITH m AS (
        SELECT d.year, d.month, SUM(f.net_price) AS revenue
        FROM pocketstack.marts.fact_sales f
        JOIN pocketstack.marts.dim_date d ON d.date_day = f.ship_date
        GROUP BY 1, 2
      )
      SELECT
        cur.year,
        cur.month,
        cur.revenue,
        ly.revenue    AS revenue_ly,
        cur.revenue - ly.revenue AS abs_yoy,
        CASE WHEN ly.revenue IS NULL OR ly.revenue = 0 THEN NULL
             ELSE 100.0 * (cur.revenue - ly.revenue) / ly.revenue END AS rel_yoy,
        prev.revenue  AS revenue_pop,
        cur.revenue - prev.revenue AS abs_pop,
        CASE WHEN prev.revenue IS NULL OR prev.revenue = 0 THEN NULL
             ELSE 100.0 * (cur.revenue - prev.revenue) / prev.revenue END AS rel_pop
      FROM m cur
      LEFT JOIN m ly   ON ly.year = cur.year - 1 AND ly.month = cur.month
      LEFT JOIN m prev ON prev.year = cur.year AND prev.month = cur.month - 1
    joins: []

    measures:
      - name: revenue
        sql: revenue
        type: sum
        format: currency

    dimensions:
      - name: ym
        sql: "{CUBE}.year * 100 + {CUBE}.month"
        type: number
        primary_key: true
      - name: year
        sql: year
        type: number
      - name: month
        sql: month
        type: number
      - name: revenue_ly
        sql: revenue_ly
        type: number
      - name: abs_yoy
        sql: abs_yoy
        type: number
      - name: rel_yoy
        sql: rel_yoy
        type: number
      - name: revenue_pop
        sql: revenue_pop
        type: number
      - name: abs_pop
        sql: abs_pop
        type: number
      - name: rel_pop
        sql: rel_pop
        type: number
