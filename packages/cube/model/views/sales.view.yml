views:
  - name: sales
    title: Продажи (витрина)
    description: |
      Витрина продаж для конечных запросов: факт fact_sales + разрезы клиент/деталь/
      поставщик/заказ/календарь в одном пространстве имён. Обычно запросы агента и
      дашбордов идут сюда, а не в отдельные кубы.
      Члены измерений получают префикс алиаса: customer.region, part.brand,
      supplier.nation, order.status, calendar.year и т.п.
    cubes:
      - join_path: fact_sales
        includes: "*"
      - join_path: fact_sales.dim_customer
        alias: customer
        includes:
          - customer_nation
          - customer_region
          - market_segment
      - join_path: fact_sales.dim_part
        alias: part
        includes:
          - brand
          - manufacturer
          - part_type
      - join_path: fact_sales.dim_supplier
        alias: supplier
        includes:
          - supplier_nation
          - supplier_region
      - join_path: fact_sales.dim_order
        alias: order
        includes:
          - order_status
          - order_priority
          - order_date
      - join_path: fact_sales.dim_date
        alias: calendar
        includes:
          - date_day
          - year
          - quarter
          - month
          - day

    # RBAC (docs/cube-rbac.md): политика витрины. admin — всё; user — ровно
    # 3 меры (выручка, кол-во единиц, кол-во заказов) и строки только своего
    # региона (region приходит подписанным claim'ом токена / учётки SQL API).
    # Все прочие группы — deny by default.
    access_policy:
      - group: admin
        member_level:
          includes: "*"
        row_level:
          allow_all: true

      - group: user
        member_level:
          includes:
            - revenue
            - quantity
            - orders_count
            - customer_nation
            - customer_region
            - market_segment
            - brand
            - manufacturer
            - part_type
            - supplier_nation
            - supplier_region
            - order_status
            - order_priority
            - order_date
            - date_day
            - year
            - quarter
            - month
            - day
            - line_key
            - order_id
            - line_number
            - return_flag
            - line_status
            - ship_mode
            - days_in_transit
            - ship_date
            - commit_date
            - receipt_date
        row_level:
          filters:
            - member: customer_region
              operator: equals
              values: ["{ securityContext.region }"]
