views:
  - name: sales
    title: Продажи (витрина)
    description: |
      Витрина продаж для конечных запросов: факт fact_sales + разрезы клиент/деталь/
      поставщик/заказ/календарь в одном пространстве имён. Обычно запросы агента и
      дашбордов идут сюда, а не в отдельные кубы.
      Члены измерений получают префикс алиаса: customer.region, part.brand,
      supplier.nation, order.status, calendar.year и т.п.
    cubes:
      - join_path: fact_sales
        includes: "*"
      - join_path: fact_sales.dim_customer
        alias: customer
        includes:
          - customer_nation
          - customer_region
          - market_segment
      - join_path: fact_sales.dim_part
        alias: part
        includes:
          - brand
          - manufacturer
          - part_type
      - join_path: fact_sales.dim_supplier
        alias: supplier
        includes:
          - supplier_nation
          - supplier_region
      - join_path: fact_sales.dim_order
        alias: order
        includes:
          - order_status
          - order_priority
          - order_date
      - join_path: fact_sales.dim_date
        alias: calendar
        includes:
          - date_day
          - year
          - quarter
          - month
          - day
