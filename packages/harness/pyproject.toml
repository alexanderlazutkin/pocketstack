[project]
name = "pocketstack-harness"
version = "0.0.0"
description = "Verification harness: golden questions, result + SQL parity via cube.dev"
requires-python = ">=3.13"
dependencies = [
    "duckdb==1.5.5",
    "pandas<3.0.0",
    "psycopg[binary]>=3",
    "pytest>=8",
    "requests>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# только пакет harness (stage2_smoke/tests — не устанавливаем)
packages = ["harness"]
