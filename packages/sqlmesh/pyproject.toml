[project]
name = "pocketstack-sqlmesh"
version = "0.0.0"
description = "sqlmesh transformations: raw_tpch -> star schema marts"
requires-python = ">=3.13"
dependencies = [
    "sqlmesh==0.236.4",
    "duckdb==1.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# только модуль seed_tpch (models/ — YAML-модель sqlmesh, logs/ — рантайм-логи;
# плоская auto-discovery setuptools на них падает)
only-include = ["seed_tpch.py"]
sources = ["."]
